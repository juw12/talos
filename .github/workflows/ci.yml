name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (standard library only, nothing to install)
        run: python -W ignore -m unittest discover -s tests -t .
      - name: Demo run with the scripted stand-in model
        run: python -m talos demo
      - name: Installs as a package
        run: |
          python -m pip install .
          talos --version

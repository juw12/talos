name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build talos.exe (one file, Python included)
        run: |
          python -m pip install pyinstaller
          pyinstaller --onefile --name talos --icon talos/web/talos.ico --add-data "talos/web;talos/web" packaging/talos_exe.py
      - name: The exe starts and runs the demo
        run: |
          dist\talos.exe --version
          dist\talos.exe demo
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ github.ref_name }} || gh release create ${{ github.ref_name }} --title "Talos ${{ github.ref_name }}" --generate-notes
          gh release upload ${{ github.ref_name }} dist\talos.exe --clobber

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "talos"
description = "One agent that does what OpenCode and Hermes Agent do, on any model, and says how it checked its own work."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Juwen Lie" }]
dependencies = []
dynamic = ["version"]
keywords = ["agent", "coding-agent", "opencode", "hermes", "ollama", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/juw12/talos"

[project.scripts]
talos = "talos.cli:main"

[tool.setuptools]
packages = ["talos"]

[tool.setuptools.dynamic]
version = { attr = "talos.__version__" }

[tool.setuptools.package-data]
talos = ["web/*"]
